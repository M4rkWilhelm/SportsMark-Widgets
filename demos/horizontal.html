        widgetBg: '#e2e8f0',
        gameBg: '#f8fafc',
        navBg: '#334155',
        widgetBorderColor: '#64748b',
        gameBorderColor: '#64748b',
        widgetBorderWidth: '0px',
        gameBorderWidth: '1px',
